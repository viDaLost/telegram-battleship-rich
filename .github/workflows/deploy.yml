name: Deploy Battleship Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battleship-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test game engine
        run: npm test

      - name: Resolve or create D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-d1.mjs

      - name: Prepare Worker secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SHIP_EMOJI_IDS: ${{ secrets.SHIP_EMOJI_IDS }}
        run: node scripts/prepare-worker-secrets.mjs

      - name: Deploy Worker and apply D1 migrations
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          preCommands: wrangler d1 migrations apply telegram-battleship --remote --config wrangler.generated.jsonc
          command: deploy --config wrangler.generated.jsonc --secrets-file .worker-secrets.json

      - name: Remove temporary secret file
        if: always()
        run: rm -f .worker-secrets.json

      - name: Resolve Worker URL
        id: worker_url
        env:
          RAW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          candidate="$(printf '%s\n' "$RAW_DEPLOYMENT_URL" | grep -Eo 'https?://[^[:space:]]+|[A-Za-z0-9.-]+\.workers\.dev' | head -n 1 || true)"
          if [ -z "$candidate" ]; then
            candidate="$(printf '%s\n' "$WRANGLER_OUTPUT" | grep -Eo 'https?://[^[:space:]]+|[A-Za-z0-9.-]+\.workers\.dev' | head -n 1 || true)"
          fi
          candidate="${candidate%%[),]}"
          if [[ "$candidate" != http://* && "$candidate" != https://* && -n "$candidate" ]]; then
            candidate="https://$candidate"
          fi
          if [[ ! "$candidate" =~ ^https://[A-Za-z0-9.-]+(/.*)?$ ]]; then
            echo "Could not resolve a valid HTTPS Worker URL from Wrangler output." >&2
            exit 1
          fi
          echo "worker_url=$candidate" >> "$GITHUB_OUTPUT"

      - name: Configure @battles_hip_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          EXPECTED_BOT_USERNAME: battles_hip_bot
        run: node scripts/configure-bot.mjs

      - name: Configure Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WORKER_URL: ${{ steps.worker_url.outputs.worker_url }}
        run: node scripts/set-webhook.mjs "$WORKER_URL"

      - name: Health check
        env:
          WORKER_URL: ${{ steps.worker_url.outputs.worker_url }}
        run: |
          test -n "$WORKER_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WORKER_URL/health"
